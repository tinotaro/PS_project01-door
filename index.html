<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Replace Custom v5)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Round+1c:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 基本デザイン（arei風のシンプル・ダーク系） --- */
        :root {
            --bg-color: #1a1a1a;
            --text-color: #cccccc;
            --sidebar-bg: #242424;
            --border-color: #333333;
            --accent-color: #4a90e2;
            --button-hover: #357abd;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 左側メニュー --- */
        #sidebar {
            width: 290px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 14px;
            gap: 15px;
        }

        /* たためるセクションの基本構造 */
        .menu-section {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* クリックできるタイトル */
        .menu-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            padding: 8px 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: bold;
        }
        .menu-title:hover {
            color: #fff;
            background-color: #2c2c2c;
        }
        .menu-title::after {
            content: '▼';
            font-size: 9px;
            transition: transform 0.2s;
        }
        /* 閉じているときの矢印の向き */
        .menu-section.collapsed .menu-title::after {
            transform: rotate(-90deg);
        }

        /* セクションの中身 */
        .menu-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 5px;
        }
        /* 閉じているときは非表示 */
        .menu-section.collapsed .menu-content {
            display: none;
        }

        /* ボタン類の共通スタイル */
        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        /* アイコンボタン横並び用のスタイル */
        .dict-icon-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }
        .dict-icon-btn {
            font-size: 13px;
            font-weight: bold;
            padding: 8px;
            text-align: center;
            background-color: #2c3e50;
        }

        /* 簡易辞書表示エリア */
        #dict-preview-area {
            background: #151515;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
            color: #eee;
            line-height: 1.5;
        }
        .preview-placeholder {
            color: #666;
            font-style: italic;
        }

        /* ページ切り替え */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .page-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
        }
        .add-page-btn {
            background-color: #2a3a2a;
            color: #aaffaa;
        }

        .sidebar-input, .sidebar-textarea {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            font-size: 13px;
        }
        .sidebar-textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        /* カラーカスタム用の入力欄組み */
        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-code-input {
            flex: 1;
        }

        /* 文字置き換えエリアの調整 */
        .replace-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .replace-btn {
            background-color: #5c3b4d;
            color: #ffdde5;
            font-weight: bold;
            margin-top: 5px;
        }
        .replace-btn:hover {
            background-color: #804d65;
        }

        /* 定型文登録 */
        .phrase-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 150px;
            overflow-y: auto;
        }
        .phrase-item {
            display: flex;
            gap: 5px;
        }
        .phrase-btn {
            flex: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .delete-btn {
            background-color: #552222;
            color: #ffaaaa;
            padding: 6px 10px;
        }

        .save-btn {
            background-color: #3b3b5c;
            color: #ddddff;
            font-weight: bold;
        }

        /* --- 右側：メイン執筆エリア --- */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 40px;
            box-sizing: border-box;
        }

        #editor-wrapper {
            width: 100%;
            max-width: 720px;
            height: 85vh;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        /* 特等席ツールバー */
        #quick-toolbar {
            display: flex;
            gap: 6px;
            padding: 10px 20px;
            background-color: #181818;
            border-bottom: 1px solid var(--border-color);
            border-radius: 4px 4px 0 0;
        }
        .quick-btn {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #eee;
            padding: 4px 12px;
            font-size: 14px;
            font-family: 'Shippori Mincho', serif;
            min-width: 38px;
            text-align: center;
        }

        #editor {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: #dddddd;
            padding: 30px 40px 40px 40px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            font-family: 'Shippori Mincho', serif;
            font-size: 17px;
            line-height: 1.8;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        #editor-footer {
            padding: 10px 20px;
            background-color: #151515;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- 左側メニュー -->
    <div id="sidebar">
        
        <!-- 1. 意味・使い方チェック -->
        <div class="menu-section" id="section-dict">
            <div class="menu-title" onclick="toggleSection('section-dict')">言葉の意味を調べる</div>
            <div class="menu-content">
                <div class="dict-icon-row">
                    <button class="dict-icon-btn" onclick="searchWordInline('kotobank')" title="コトバンク">📘 コ</button>
                    <button class="dict-icon-btn" onclick="searchWordInline('weblio')" title="Weblio類語">📚 辞</button>
                    <button class="dict-icon-btn" onclick="resetDictInline()" style="background-color:#444;" title="リセット">🔄 リ</button>
                </div>
                <div id="dict-preview-area">
                    <span class="preview-placeholder">本文で文字を選択して、上のアイコンを押すとここに簡易表示されます。</span>
                </div>
            </div>
        </div>

        <!-- 【新設】2. 文字の置き換え（一括置換） -->
        <div class="menu-section" id="section-replace">
            <div class="menu-title" onclick="toggleSection('section-replace')">文字の置き換え（一括）</div>
            <div class="menu-content">
                <div class="replace-group">
                    <input type="text" id="replace-src" class="sidebar-input" placeholder="置き換え前の文字（消したい文字）">
                    <input type="text" id="replace-dst" class="sidebar-input" placeholder="置き換え後の文字（新しい文字）">
                    <button class="replace-btn" onclick="replaceAllText()">すべてのページを置き換える</button>
                </div>
            </div>
        </div>

        <!-- 3. よく使う文章・単語登録 -->
        <div class="menu-section" id="section-phrases">
            <div class="menu-title" onclick="toggleSection('section-phrases')">よく使う単語・文章登録</div>
            <div class="menu-content">
                <input type="text" id="new-phrase-input" class="sidebar-input" placeholder="文章を入力してEnterで登録">
                <div class="phrase-list" id="phrase-container"></div>
            </div>
        </div>

        <!-- 4. ページ管理 -->
        <div class="menu-section" id="section-pages">
            <div class="menu-title" onclick="toggleSection('section-pages')">ページ管理</div>
            <div class="menu-content">
                <div class="page-grid" id="page-container"></div>
                <button class="add-page-btn" onclick="addNewPage()">＋ 新しいページを追加</button>
            </div>
        </div>

        <!-- 5. 表示・カラー設定 -->
        <div class="menu-section" id="section-settings">
            <div class="menu-title" onclick="toggleSection('section-settings')">表示・カラー設定</div>
            <div class="menu-content">
                <select id="font-selector" onchange="changeFontFamily(this.value)">
                    <option value="'Shippori Mincho', serif">しっぽり明朝（濁点対応）</option>
                    <option value="'M PLUS Round 1c', sans-serif">かわいめ丸ゴシック</option>
                    <option value="'Helvetica Neue', Arial, sans-serif">標準ゴシック体</option>
                </select>
                <div class="btn-row">
                    <button onclick="changeFontSize('14px')">小</button>
                    <button onclick="changeFontSize('17px')">中</button>
                    <button onclick="changeFontSize('22px')">大</button>
                </div>
                <div class="color-picker-group">
                    <span style="font-size:12px; width:55px;">背景色:</span>
                    <input type="text" id="bg-color-code" class="sidebar-input color-code-input" value="#1e1e1e" placeholder="#1e1e1e" oninput="applyCustomColors()">
                </div>
                <div class="color-picker-group">
                    <span style="font-size:12px; width:55px;">文字色:</span>
                    <input type="text" id="text-color-code" class="sidebar-input color-code-input" value="#dddddd" placeholder="#dddddd" oninput="applyCustomColors()">
                </div>
            </div>
        </div>

        <!-- 6. 作品出力 -->
        <div class="menu-section" id="section-save">
            <div class="menu-title" onclick="toggleSection('section-save')">作品出力</div>
            <div class="menu-content">
                <input type="text" id="file-name-input" class="sidebar-input" value="novel_draft" placeholder="ファイル名を入力">
                <button class="save-btn" onclick="exportToTxt()">.txt形式で全ページ保存</button>
            </div>
        </div>

        <!-- 7. 作品メモ -->
        <div class="menu-section" id="section-memo">
            <div class="menu-title" onclick="toggleSection('section-memo')">作品メモ</div>
            <div class="menu-content">
                <textarea id="memo-area" class="sidebar-textarea" placeholder="プロットや設定メモ（自動保存）" oninput="saveMemo()"></textarea>
            </div>
        </div>
    </div>

    <!-- 右側：執筆メインエリア -->
    <div id="main-container">
        <div id="editor-wrapper">
            <div id="quick-toolbar">
                <button class="quick-btn" onclick="insertQuickText('「」')">「」</button>
                <button class="quick-btn" onclick="insertQuickText('――')">――</button>
                <button class="quick-btn" onclick="insertQuickText('……')">……</button>
                <button class="quick-btn" onclick="insertQuickText('゛')">゛</button>
                <button class="quick-btn" onclick="insertQuickText('♡')">♡</button>
                <button class="quick-btn" onclick="insertQuickText('ッ')">ッ</button>
                <button class="quick-btn" onclick="insertQuickText('▼▼▼')">▼▼▼</button>
            </div>
            
            <textarea id="editor" placeholder="ここに小説を書き出せます..." oninput="updatePageData()" onselect="handleTextSelection()"></textarea>
            <div id="editor-footer">
                <span id="current-page-display">ページ: 1</span>
                <span id="char-count-display">0 文字</span>
            </div>
        </div>
    </div>

    <script>
        // --- データ・状態管理 ---
        let pages = [""];
        let currentPageIndex = 0;
        let selectedText = "";

        let customPhrases = JSON.parse(localStorage.getItem('novel_phrases')) || [
            "同数くらいで考え中",
            "息を呑んだ。",
            "あ゛っ、"
        ];

        const editor = document.getElementById('editor');
        const editorWrapper = document.getElementById('editor-wrapper');
        const pageContainer = document.getElementById('page-container');
        const phraseContainer = document.getElementById('phrase-container');
        const memoArea = document.getElementById('memo-area');
        const previewArea = document.getElementById('dict-preview-area');

        window.onload = function() {
            renderPages();
            renderPhrases();
            loadPage(0);
            
            if(localStorage.getItem('custom_bg_color')) {
                document.getElementById('bg-color-code').value = localStorage.getItem('custom_bg_color');
            }
            if(localStorage.getItem('custom_text_color')) {
                document.getElementById('text-color-code').value = localStorage.getItem('custom_text_color');
            }
            applyCustomColors();

            if(localStorage.getItem('novel_memo')) {
                memoArea.value = localStorage.getItem('novel_memo');
            }

            document.getElementById('new-phrase-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim() !== "") {
                    customPhrases.push(this.value.trim());
                    localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
                    this.value = "";
                    renderPhrases();
                }
            });
        };

        // --- メニュー折りたたみ開閉制御 ---
        function toggleSection(id) {
            const section = document.getElementById(id);
            section.classList.toggle('collapsed');
        }

        // --- カラーコードのリアルタイム反映 ---
        function applyCustomColors() {
            const bgColor = document.getElementById('bg-color-code').value.trim();
            const textColor = document.getElementById('text-color-code').value.trim();

            if (bgColor.match(/^#[0-9a-fA-F]{3,6}$/) || bgColor === "transparent") {
                editorWrapper.style.backgroundColor = bgColor;
                localStorage.setItem('custom_bg_color', bgColor);
            }
            if (textColor.match(/^#[0-9a-fA-F]{3,6}$/)) {
                editor.style.color = textColor;
                localStorage.setItem('custom_text_color', textColor);
            }
        }

        // --- 【新機能】文字の一括置き換え処理 ---
        function replaceAllText() {
            const srcText = document.getElementById('replace-src').value;
            const dstText = document.getElementById('replace-dst').value;

            if (!srcText) {
                alert("置き換え前の文字（消したい文字）を入力してください。");
                return;
            }

            // 現在表示中のページの最新内容を配列に同期
            pages[currentPageIndex] = editor.value;

            // 特殊文字をエスケープして正規表現を作成（すべて一括置換するため「g」フラグを使用）
            const escapedSrc = srcText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(escapedSrc, 'g');

            let totalCount = 0;

            // 全ページを走査して文字を置換
            pages = pages.map((pageText) => {
                const matches = pageText.match(regex);
                if (matches) {
                    totalCount += matches.length;
                }
                return pageText.replace(regex, dstText);
            });

            // エディタの表示内容を更新
            editor.value = pages[currentPageIndex];
            updatePageData();

            alert(`すべてのページから「${srcText}」を「${dstText}」に一括置き換えしました（計 ${totalCount} 箇所）。`);
            
            // 入力欄をクリア
            document.getElementById('replace-src').value = "";
            document.getElementById('replace-dst').value = "";
        }

        // --- 選択テキストの取得 ---
        function handleTextSelection() {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value.substring(start, end).trim();
            if (text && start !== end) {
                selectedText = text;
            }
        }

        // --- その場で簡易辞書表示 ---
        function searchWordInline(type) {
            if (!selectedText) {
                previewArea.innerHTML = `<span style="color:#e74c3c;">⚠️ 本文の調べたい文字をドラッグ選択してから押してください。</span>`;
                return;
            }

            previewArea.innerHTML = `<span style="color:#3498db;">🔄 「${selectedText}」を検索中...</span>`;

            let searchUrl = "";
            let siteName = "";
            
            if (type === 'kotobank') {
                siteName = "コトバンク";
                searchUrl = `https://kotobank.jp/word/${encodeURIComponent(selectedText)}`;
            } else if (type === 'weblio') {
                siteName = "Weblio類語辞典";
                searchUrl = `https://thesaurus.weblio.jp/content/${encodeURIComponent(selectedText)}`;
            }

            setTimeout(() => {
                previewArea.innerHTML = `
                    <div style="font-weight:bold; color:#4a90e2; margin-bottom:5px;">🧐 「${selectedText}」の検索</div>
                    <div style="font-size:12px; color:#aaa; margin-bottom:8px;">セキュリティ制限のため、安全な簡易ウィンドウで開きます。</div>
                    <button onclick="window.open('${searchUrl}', '_blank')" style="width:100%; background:#2c3e50; text-align:center; padding:8px;">
                        🔗 ${siteName} で直接確認する
                    </button>
                `;
            }, 300);
        }

        function resetDictInline() {
            selectedText = "";
            previewArea.innerHTML = `<span class="preview-placeholder">本文で文字を選択して、上のアイコンを押すとここに簡易表示されます。</span>`;
        }

        // --- 特等席ボタン（共通） ---
        function insertQuickText(text) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const currentVal = editor.value;

            if (text === '「」') {
                const selected = currentVal.substring(start, end);
                editor.value = currentVal.substring(0, start) + "「" + selected + "」" + currentVal.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 1 + selected.length;
            } else {
                editor.value = currentVal.substring(0, start) + text + currentVal.substring(end);
                editor.selectionStart = editor.selectionEnd = start + text.length;
            }
            updatePageData();
            editor.focus();
        }

        // --- ページ処理 ---
        function renderPages() {
            pageContainer.innerHTML = "";
            pages.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.className = `page-btn ${index === currentPageIndex ? 'active' : ''}`;
                btn.innerText = index + 1;
                btn.onclick = () => loadPage(index);
                pageContainer.appendChild(btn);
            });
        }

        function loadPage(index) {
            pages[currentPageIndex] = editor.value;
            currentPageIndex = index;
            editor.value = pages[currentPageIndex];
            renderPages();
            updatePageData();
            resetDictInline();
            editor.focus();
        }

        function addNewPage() {
            pages[currentPageIndex] = editor.value;
            pages.push(""); 
            loadPage(pages.length - 1);
        }

        function updatePageData() {
            pages[currentPageIndex] = editor.value;
            document.getElementById('current-page-display').innerText = `ページ: ${currentPageIndex + 1} / ${pages.length}`;
            document.getElementById('char-count-display').innerText = `${editor.value.length} 文字`;
        }

        // --- 表示設定変更 ---
        function changeFontFamily(fontName) {
            editor.style.fontFamily = fontName;
            document.querySelectorAll('.quick-btn').forEach(btn => btn.style.fontFamily = fontName);
        }

        function changeFontSize(size) {
            editor.style.fontSize = size;
        }

        // --- 定型文処理 ---
        function renderPhrases() {
            phraseContainer.innerHTML = "";
            customPhrases.forEach((phrase, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'phrase-item';

                const btn = document.createElement('button');
                btn.className = 'phrase-btn';
                btn.innerText = phrase;
                btn.title = phrase;
                btn.onclick = () => insertQuickText(phrase);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = '×';
                delBtn.onclick = () => deletePhrase(index);

                wrapper.appendChild(btn);
                wrapper.appendChild(delBtn);
                phraseContainer.appendChild(wrapper);
            });
        }

        function deletePhrase(index) {
            customPhrases.splice(index, 1);
            localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
            renderPhrases();
        }

        function saveMemo() {
            localStorage.setItem('novel_memo', memoArea.value);
        }

        function exportToTxt() {
            pages[currentPageIndex] = editor.value;
            const joinedText = pages.map((pageText, index) => {
                return `--- 【${index + 1}ページ目】 ---\n${pageText}`;
            }).join('\n\n');

            const blob = new Blob([joinedText], { type: 'text/plain;charset=utf-8' });
            const fileNameInput = document.getElementById('file-name-input').value.trim();
            const fileName = (fileNameInput !== "") ? `${fileNameInput}.txt` : "novel_draft.txt";

            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = fileName;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
