<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Perfect Left Menu)</title>
    <!-- Google Fonts から「しっぽり明朝」と「M PLUS Round 1c」を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Round+1c:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 基本デザイン（arei風のシンプル・ダーク系） --- */
        :root {
            --bg-color: #1a1a1a;
            --text-color: #cccccc;
            --sidebar-bg: #242424;
            --border-color: #333333;
            --accent-color: #4a90e2;
            --button-hover: #357abd;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 左側メニュー（一律左配置） --- */
        #sidebar {
            width: 290px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 14px;
            gap: 25px;
        }

        .menu-section {
            display: flex;
            flex-direction: column;
        }

        .menu-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        /* ボタン類の共通スタイル */
        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        /* ページ切り替え */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        .page-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
        }
        .add-page-btn {
            width: 100%;
            background-color: #2a3a2a;
            color: #aaffaa;
        }
        .add-page-btn:hover {
            background-color: #3a5a3a;
        }

        /* 各種入力コントロール */
        .sidebar-input, .sidebar-textarea {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            font-size: 13px;
        }
        .sidebar-input { margin-bottom: 5px; }
        .sidebar-textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            line-height: 1.4;
        }

        /* 選択中の言葉チェック用エリア（強化ポイント） */
        #selected-word-display {
            background: #151515;
            padding: 8px;
            border-radius: 4px;
            border: 1px dashed #555;
            min-height: 20px;
            margin-bottom: 8px;
            word-break: break-all;
            color: #fff;
            font-style: italic;
        }
        .dict-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .dict-buttons button {
            text-align: left;
            background-color: #2c3e50;
            border-color: #34495e;
        }
        .dict-buttons button:hover {
            background-color: var(--accent-color);
        }

        /* フォント・文字サイズ変更 */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-row {
            display: flex;
            gap: 5px;
        }
        .btn-row button {
            flex: 1;
        }
        select {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* 定型文登録 */
        .phrase-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 150px;
            overflow-y: auto;
        }
        .phrase-item {
            display: flex;
            gap: 5px;
        }
        .phrase-btn {
            flex: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .delete-btn {
            background-color: #552222;
            color: #ffaaaa;
            padding: 6px 10px;
        }
        .delete-btn:hover {
            background-color: #aa3333;
        }

        /* 作品保存（.txt） */
        .save-btn {
            background-color: #3b3b5c;
            color: #ddddff;
            font-weight: bold;
        }
        .save-btn:hover {
            background-color: #4d4d80;
        }

        /* --- 右側：メイン執筆エリア（areiリスペクト） --- */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        #editor-wrapper {
            width: 100%;
            max-width: 720px;
            height: 85vh;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: #dddddd;
            padding: 40px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            font-family: 'Shippori Mincho', serif;
            font-size: 17px;
            line-height: 1.8;
            letter-spacing: 0.05em;
        }

        #editor-footer {
            padding: 10px 20px;
            background-color: #151515;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            border-radius: 0 0 4px 4px;
        }
    </style>
</head>
<body>

    <!-- 左側メニュー（一律左配置に完全統一） -->
    <div id="sidebar">
        
        <!-- 【新設】選択した言葉のチェックエリア -->
        <div class="menu-section">
            <div class="menu-title">言葉の意味・使い方チェック</div>
            <div id="selected-word-display">本文で文字を選択してください</div>
            <div class="dict-buttons">
                <button onclick="searchWord('kotobank')">🔍 コトバンクで意味を調べる</button>
                <button onclick="searchWord('weblio')">📚 Weblio類語辞典で調べる</button>
                <button onclick="searchWord('google')">🌐 Googleで使い方・誤用検索</button>
            </div>
        </div>

        <!-- 作品保存（.txt） -->
        <div class="menu-section">
            <div class="menu-title">作品出力</div>
            <input type="text" id="file-name-input" class="sidebar-input" value="novel_draft" placeholder="ファイル名を入力">
            <button class="save-btn" onclick="exportToTxt()">.txt形式で全ページ保存</button>
        </div>

        <!-- ページ管理 (方式A) -->
        <div class="menu-section">
            <div class="menu-title">ページ管理 (方式A)</div>
            <div class="page-grid" id="page-container"></div>
            <button class="add-page-btn" onclick="addNewPage()">＋ 新しいページを追加</button>
        </div>

        <!-- フォント・文字サイズ設定 -->
        <div class="menu-section">
            <div class="menu-title">表示設定</div>
            <div class="control-group">
                <select id="font-selector" onchange="changeFontFamily(this.value)">
                    <option value="'Shippori Mincho', serif">しっぽり明朝（濁点対応）</option>
                    <option value="'M PLUS Round 1c', sans-serif">かわいめ丸ゴシック</option>
                    <option value="'Helvetica Neue', Arial, sans-serif">標準ゴシック体</option>
                </select>
                <div class="btn-row">
                    <button onclick="changeFontSize('14px')">小</button>
                    <button onclick="changeFontSize('17px')">中</button>
                    <button onclick="changeFontSize('22px')">大</button>
                </div>
            </div>
        </div>

        <!-- 定型文ボタン機能 -->
        <div class="menu-section">
            <div class="menu-title">よく使う文章（定型文）</div>
            <input type="text" id="new-phrase-input" class="sidebar-input" placeholder="文章を入力してEnterで登録">
            <div class="phrase-list" id="phrase-container"></div>
        </div>

        <!-- 作品メモ用エリア -->
        <div class="menu-section">
            <div class="menu-title">作品メモ</div>
            <textarea id="memo-area" class="sidebar-textarea" placeholder="プロットや設定メモ（自動保存）" oninput="saveMemo()"></textarea>
        </div>
    </div>

    <!-- 右側：執筆メインエリア -->
    <div id="main-container">
        <div id="editor-wrapper">
            <textarea id="editor" placeholder="ここに小説を書き出せます..." oninput="updatePageData()" onselect="handleTextSelection()"></textarea>
            <div id="editor-footer">
                <span id="current-page-display">ページ: 1</span>
                <span id="char-count-display">0 文字</span>
            </div>
        </div>
    </div>

    <script>
        // --- データ管理 ---
        let pages = [""];
        let currentPageIndex = 0;

        let customPhrases = JSON.parse(localStorage.getItem('novel_phrases')) || [
            "同数くらいで考え中",
            "息を呑んだ。",
            "あ゛っ、"
        ];

        const editor = document.getElementById('editor');
        const pageContainer = document.getElementById('page-container');
        const phraseContainer = document.getElementById('phrase-container');
        const memoArea = document.getElementById('memo-area');
        const wordDisplay = document.getElementById('selected-word-display');
        let selectedText = "";

        window.onload = function() {
            renderPages();
            renderPhrases();
            loadPage(0);
            
            if(localStorage.getItem('novel_memo')) {
                memoArea.value = localStorage.getItem('novel_memo');
            }

            document.getElementById('new-phrase-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim() !== "") {
                    customPhrases.push(this.value.trim());
                    localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
                    this.value = "";
                    renderPhrases();
                }
            });
        };

        // --- 【確実版】選択テキスト取得処理 ---
        function handleTextSelection() {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value.substring(start, end).trim();

            if (text && start !== end) {
                selectedText = text;
                wordDisplay.innerText = `「${text}」が選択中`;
                wordDisplay.style.color = "#4a90e2";
                wordDisplay.style.fontWeight = "bold";
            }
        }

        // 外部サイト連携（センシティブ完全フリー）
        function searchWord(type) {
            if (!selectedText) {
                alert("先に本文の調べたい文字をマウスなどで選択してください。");
                return;
            }
            let url = "";
            if (type === 'kotobank') {
                url = `https://kotobank.jp/word/${encodeURIComponent(selectedText)}`;
            } else if (type === 'weblio') {
                url = `https://thesaurus.weblio.jp/content/${encodeURIComponent(selectedText)}`;
            } else if (type === 'google') {
                url = `https://www.google.com/search?q=${encodeURIComponent(selectedText + " 意味 使い方")}`;
            }
            window.open(url, '_blank');
        }

        // --- ページ切り替え機能 ---
        function renderPages() {
            pageContainer.innerHTML = "";
            pages.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.className = `page-btn ${index === currentPageIndex ? 'active' : ''}`;
                btn.innerText = index + 1;
                btn.onclick = () => loadPage(index);
                pageContainer.appendChild(btn);
            });
        }

        function loadPage(index) {
            pages[currentPageIndex] = editor.value;
            currentPageIndex = index;
            editor.value = pages[currentPageIndex];
            renderPages();
            updatePageData();
            
            // ページ移動時に選択状態をリセット
            selectedText = "";
            wordDisplay.innerText = "本文で文字を選択してください";
            wordDisplay.style.color = "#777";
            wordDisplay.style.fontWeight = "normal";
            
            editor.focus();
        }

        function addNewPage() {
            pages[currentPageIndex] = editor.value;
            pages.push(""); 
            loadPage(pages.length - 1);
        }

        function updatePageData() {
            pages[currentPageIndex] = editor.value;
            document.getElementById('current-page-display').innerText = `ページ: ${currentPageIndex + 1} / ${pages.length}`;
            document.getElementById('char-count-display').innerText = `${editor.value.length} 文字`;
        }

        // --- 表示設定 ---
        function changeFontFamily(fontName) {
            editor.style.fontFamily = fontName;
        }

        function changeFontSize(size) {
            editor.style.fontSize = size;
        }

        // --- 定型文 ---
        function renderPhrases() {
            phraseContainer.innerHTML = "";
            customPhrases.forEach((phrase, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'phrase-item';

                const btn = document.createElement('button');
                btn.className = 'phrase-btn';
                btn.innerText = phrase;
                btn.title = phrase;
                btn.onclick = () => insertText(phrase);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = '×';
                delBtn.onclick = () => deletePhrase(index);

                wrapper.appendChild(btn);
                wrapper.appendChild(delBtn);
                phraseContainer.appendChild(wrapper);
            });
        }

        function insertText(text) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const currentVal = editor.value;
            
            editor.value = currentVal.substring(0, start) + text + currentVal.substring(end);
            editor.selectionStart = editor.selectionEnd = start + text.length;
            updatePageData();
            editor.focus();
        }

        function deletePhrase(index) {
            customPhrases.splice(index, 1);
            localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
            renderPhrases();
        }

        // --- メモ保存 ---
        function saveMemo() {
            localStorage.setItem('novel_memo', memoArea.value);
        }

        // --- .txt出力 ---
        function exportToTxt() {
            pages[currentPageIndex] = editor.value;
            const joinedText = pages.map((pageText, index) => {
                return `--- 【${index + 1}ページ目】 ---\n${pageText}`;
            }).join('\n\n');

            const blob = new Blob([joinedText], { type: 'text/plain;charset=utf-8' });
            const fileNameInput = document.getElementById('file-name-input').value.trim();
            const fileName = (fileNameInput !== "") ? `${fileNameInput}.txt` : "novel_draft.txt";

            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = fileName;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
