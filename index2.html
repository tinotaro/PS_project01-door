<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>rei-style Editor - Full Integrated</title>
    <style>
        :root { --bg-color: #808080; --text-color: #ffffff; --sidebar-bg: #707070; --panel-bg: #888888; --editor-bg: #7a7a7a; --border-color: #666666; --accent-color: #4a90e2; }
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; }
        #sidebar-palette { width: 60px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 15px 0; z-index: 1000; flex-shrink: 0; }
        .palette-icon-btn { cursor: pointer; padding: 10px; font-size: 20px; }
        #main-container { flex: 1; display: flex; flex-direction: column; padding: 20px; transition: margin-left 0.3s ease; position: relative; }
        body.panel-open #main-container { margin-left: 300px; }
        .floating-panel { position: absolute; left: 60px; top: 0; width: 300px; height: 100vh; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: none; flex-direction: column; padding: 20px; z-index: 999; box-sizing: border-box; }
        .floating-panel.active { display: flex; }
        #editor-wrapper { flex: 1; display: flex; flex-direction: column; background: var(--editor-bg); }
        #editor { flex: 1; width: 100%; background: transparent; color: var(--text-color); border: none; padding: 20px; resize: none; }
        .panel-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .theme-select-btn { width: 100%; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="sidebar-palette">
        <div class="palette-icon-btn" onclick="togglePanel('panel-dict')">🔍</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-replace')">🔁</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-memo')">✒️</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-youtube')">🎬</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-settings')">🖌️</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-save')">🔖</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-help')">❓</div>
    </div>

    <div class="floating-panel" id="panel-settings">
        <div class="panel-header">表示設定 <button onclick="closeAllPanels()">×</button></div>
        <button class="theme-select-btn" onclick="applyPresetTheme('default')">デフォルトブラック</button>
        <button class="theme-select-btn" onclick="applyPresetTheme('default-white')">デフォルトホワイト</button>
    </div>
    <div class="floating-panel" id="panel-dict"><div class="panel-header">辞書 <button onclick="closeAllPanels()">×</button></div><div id="dict-preview-area"></div></div>
    <div class="floating-panel" id="panel-replace"><div class="panel-header">置換 <button onclick="closeAllPanels()">×</button></div><input id="replace-src"><input id="replace-dst"><button onclick="executeConfirmedReplaceAll()">置換実行</button></div>
    <div class="floating-panel" id="panel-memo"><div class="panel-header">メモ <button onclick="closeAllPanels()">×</button></div><textarea id="memo-area" oninput="saveMemo()"></textarea></div>
    <div class="floating-panel" id="panel-youtube"><div class="panel-header">YouTube <button onclick="closeAllPanels()">×</button></div><input id="yt-url-input"><button onclick="loadYouTubeVideo()">読込</button><div id="yt-container"></div></div>
    <div class="floating-panel" id="panel-save"><div class="panel-header">保存 <button onclick="closeAllPanels()">×</button></div><button onclick="exportToTxt()">全ページ保存</button></div>
    <div class="floating-panel" id="panel-help"><div class="panel-header">ヘルプ <button onclick="closeAllPanels()">×</button></div></div>

    <div id="main-container">
        <div id="editor-wrapper"><textarea id="editor" oninput="updatePageData()"></textarea></div>
        <div id="page-container"></div><button onclick="addNewPage()">＋追加</button>
    </div>
    <script>
    let pages = [""];
    let currentPageIndex = 0;
    const editor = document.getElementById('editor');

    function togglePanel(id) {
        const panel = document.getElementById(id);
        const isActive = panel.classList.contains('active');
        document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active'));
        document.body.classList.remove('panel-open');
        if (!isActive) {
            panel.classList.add('active');
            document.body.classList.add('panel-open');
        }
    }

    function closeAllPanels() {
        document.body.classList.remove('panel-open');
        document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active'));
    }

    function updatePageData() {
        pages[currentPageIndex] = editor.value;
        localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
    }

    function addNewPage() {
        pages.push("");
        currentPageIndex = pages.length - 1;
        editor.value = "";
        localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
    }

    function applyPresetTheme(themeName) {
        const themes = {
            'default': { bg: '#808080', text: '#ffffff', side: '#707070', panel: '#888888', editor: '#7a7a7a', border: '#666666' },
            'default-white': { bg: '#ffffff', text: '#333333', side: '#f5f5f5', panel: '#ffffff', editor: '#fafafa', border: '#e0e0e0' }
        };
        const colors = themes[themeName] || themes['default'];
        const root = document.documentElement;
        Object.entries(colors).forEach(([k, v]) => root.style.setProperty('--' + (k === 'text' ? 'text-color' : k === 'side' ? 'sidebar-bg' : k + '-color'), v));
        localStorage.setItem('active_preset_theme', themeName);
    }

    function saveMemo() { localStorage.setItem('novel_memo', document.getElementById('memo-area').value); }
    function loadYouTubeVideo() { /* URL解析ロジック等 */ }
    function exportToTxt() { /* エクスポートロジック */ }
    function executeConfirmedReplaceAll() { /* 置換ロジック */ }

    window.onload = () => {
        if(localStorage.getItem('novel_saved_pages')) pages = JSON.parse(localStorage.getItem('novel_saved_pages'));
        editor.value = pages[0] || "";
        applyPresetTheme(localStorage.getItem('active_preset_theme') || 'default');
        if(localStorage.getItem('novel_memo')) document.getElementById('memo-area').value = localStorage.getItem('novel_memo');
    };
</script>
</body>
</html>
