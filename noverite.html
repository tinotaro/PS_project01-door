<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Wide Mode)</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Round+1c:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #cccccc; --sidebar-bg: #242424; --panel-bg: #2c2c2c;
            --border-color: #333333; --accent-color: #4a90e2; --button-hover: #357abd;
            --editor-bg: #1e1e1e; --panel-header-border: #444; --input-bg: #111; --ruby-color: #a5c7f2;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: sans-serif; display: flex; height: 100vh; overflow: hidden;
        }

        .emoji-bold { font-family: "Noto Color Emoji", sans-serif; font-variant-emoji: text; color: var(--text-color); }

        /* 左側パレット */
        #sidebar-palette {
            width: 56px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 10px; z-index: 10;
        }
        .palette-icon-btn {
            width: 44px; height: 38px; border-radius: 6px; background-color: rgba(0,0,0,0.15);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 18px; color: var(--text-color); font-variant-emoji: text;
        }

        /* 執筆エリア幅調整：ここを1000pxに変更 */
        #main-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: hidden; }
        #top-phrase-panel, #editor-wrapper, #bottom-page-panel {
            width: 100%; max-width: 1000px; /* 広げました */
            background-color: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 4px;
        }

        #editor-wrapper { flex: 1; margin: 10px 0; background-color: var(--editor-bg); display: flex; flex-direction: column; }
        .editor-container-inner { flex: 1; position: relative; }

        #editor, #backdrop {
            position: absolute; width: 100%; height: 100%; box-sizing: border-box;
            padding: 30px 40px; font-family: 'Shippori Mincho', serif; font-size: 17px;
            line-height: 2.2; border: none; outline: none; background: transparent; color: var(--text-color);
        }

        #bottom-page-panel { padding: 10px; }
        .page-control-row { display: flex; align-items: center; gap: 8px; }
        .page-scroll-container { flex: 1; display: flex; gap: 5px; overflow-x: auto; }
        
        button { background: rgba(0,0,0,0.2); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sidebar-palette" class="emoji-bold">
        <div class="palette-icon-btn">📖</div>
        <div class="palette-icon-btn">🔍</div>
        <div class="palette-icon-btn">📝</div>
        <div class="palette-icon-btn">🎬</div>
        <div class="palette-icon-btn">⚙️</div>
        <div class="palette-icon-btn">💾</div>
    </div>

    <div id="main-container">
        <div id="top-phrase-panel">
            <input type="text" placeholder="文章入力..." style="width:100%; background:transparent; border:none; color:inherit; padding:10px;">
        </div>

        <div id="editor-wrapper">
            <div id="quick-toolbar" style="padding:10px; border-bottom:1px solid var(--border-color);">
                <button>「」</button><button>――</button><button>……</button>
            </div>
            <div class="editor-container-inner">
                <div id="backdrop"></div>
                <textarea id="editor" placeholder="ここに執筆"></textarea>
            </div>
        </div>

        <div id="bottom-page-panel">
            <div class="page-control-row">
                <button>＋ 新規ページ</button>
                <div class="page-scroll-container" id="page-container"></div>
                <button>ページ削除</button>
            </div>
        </div>
    </div>

</body>
</html>
