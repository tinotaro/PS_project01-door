<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Pro Layout)</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #cccccc;
            --sidebar-bg: #242424;
            --border-color: #333333;
            --accent-color: #4a90e2;
        }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 250px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); overflow-y: auto; }
        .menu-title { font-size: 11px; padding: 10px; background: #282828; cursor: pointer; border-bottom: 1px solid #333; }
        .menu-content { padding: 10px; background: #202020; }
        
        /* Right Area */
        #main-container { flex: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        /* 1. Phrases (Top) */
        #phrase-toolbar { background: #222; padding: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        
        /* 2. Editor */
        #editor-wrapper { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; border: 1px solid var(--border-color); min-height: 200px; }
        #editor { flex: 1; width: 100%; background: transparent; color: #fff; border: none; padding: 20px; box-sizing: border-box; outline: none; font-size: 16px; resize: none; font-family: 'Shippori Mincho', serif; }
        
        /* 3. Page Manager (Bottom) */
        #page-toolbar { background: #222; padding: 10px; border: 1px solid var(--border-color); margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        .page-btn { padding: 5px 10px; cursor: pointer; background: #333; color: #fff; border: 1px solid #444; }
        .page-btn.active { background: var(--accent-color); }
        
        /* YouTube Player */
        #yt-container { width: 100%; aspect-ratio: 16/9; background: #000; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="menu-title" onclick="toggle('dict-sec')">辞書</div>
        <div id="dict-sec" class="menu-content"><button onclick="searchWord()">検索</button><div id="dict-preview"></div></div>
        
        <div class="menu-title" onclick="toggle('settings-sec')">設定</div>
        <div id="settings-sec" class="menu-content">...設定項目...</div>

        <div class="menu-title" onclick="toggle('yt-sec')">ミニYouTube</div>
        <div id="yt-sec" class="menu-content">
            <input type="text" id="yt-url" placeholder="動画ID (例: dQw4w9WgXcQ)" style="width:100%">
            <button onclick="loadYT()">再生</button>
            <div id="yt-container"></div>
        </div>
    </div>

    <!-- Right Writing Area -->
    <div id="main-container">
        <!-- Top: Phrases -->
        <div id="phrase-toolbar">
            <input type="text" id="new-phrase" placeholder="定型文追加" onkeypress="addPhrase(event)">
            <div id="phrase-list" style="display:flex; gap:5px;"></div>
        </div>

        <!-- Center: Editor -->
        <div id="editor-wrapper">
            <textarea id="editor" oninput="saveData()"></textarea>
        </div>

        <!-- Bottom: Pages -->
        <div id="page-toolbar">
            <button onclick="addNewPage()">+ 新規追加</button>
            <div id="page-list" style="display:flex; gap:5px;"></div>
            <button onclick="movePage(-1)">←</button>
            <button onclick="movePage(1)">→</button>
        </div>
    </div>

    <script>
        let pages = [""], currentPageIndex = 0;
        let phrases = ["同数くらいで考え中", "息を呑んだ"];

        // ページ移動ロジック
        function movePage(direction) {
            if (currentPageIndex + direction >= 0 && currentPageIndex + direction < pages.length) {
                let temp = pages[currentPageIndex];
                pages[currentPageIndex] = pages[currentPageIndex + direction];
                pages[currentPageIndex + direction] = temp;
                currentPageIndex += direction;
                render();
            }
        }

        // YTプレイヤー
        function loadYT() {
            const id = document.getElementById('yt-url').value;
            document.getElementById('yt-container').innerHTML = 
                `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`;
        }

        function toggle(id) { document.getElementById(id).style.display = document.getElementById(id).style.display === 'none' ? 'block' : 'none'; }
        
        function render() {
            document.getElementById('page-list').innerHTML = pages.map((_, i) => 
                `<button class="page-btn ${i===currentPageIndex?'active':''}" onclick="changePage(${i})">${i+1}</button>`
            ).join('');
            document.getElementById('phrase-list').innerHTML = phrases.map(p => 
                `<button onclick="insert('${p}')">${p}</button>`
            ).join('');
        }
        
        function changePage(i) { pages[currentPageIndex] = document.getElementById('editor').value; currentPageIndex = i; document.getElementById('editor').value = pages[i]; render(); }
        function addNewPage() { pages.push(""); render(); }
        function insert(text) { document.getElementById('editor').value += text; }
        
        window.onload = render;
    </script>
</body>
</html>
