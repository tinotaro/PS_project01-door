<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Palette Layout v12)</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Round+1c:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #cccccc;
            --sidebar-bg: #242424;
            --panel-bg: #2c2c2c;
            --border-color: #333333;
            --accent-color: #4a90e2;
            --button-hover: #357abd;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- 左側：アイコンツールパレット（サイズ半分・潰れ対策版） --- */
        #sidebar-palette {
            width: 44px; /* ボタンが小さくなったのでパレット幅も少しスリムに */
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            box-sizing: border-box;
            gap: 12px;
            z-index: 10;
        }

        .palette-icon-btn {
            width: 30px;  /* 44pxから縮小 */
            height: 30px; /* 44pxから縮小 */
            border-radius: 6px;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            
            /* 標準の環境絵文字を最優先にして潰れを完全に防止 */
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
            font-weight: bold;
            font-size: 11px; /* 22pxから半分のサイズへ変更 */
        }
        
        /* ホバーまたはアクティブ時 */
        .palette-icon-btn:hover, .palette-icon-btn.active {
            background-color: var(--accent-color);
            border-color: #fff;
            transform: scale(1.08);
        }

        .palette-icon-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 42px; /* パレットの幅に合わせて調整 */
            top: 50%;
            transform: translateY(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-weight: normal;
        }
        .palette-icon-btn:hover::after {
            opacity: 1;
        }

        /* --- ポップアップする機能パネル --- */
        .floating-panel {
            position: absolute;
            left: 50px; /* パレットの幅に合わせて調整 */
            top: 15px;
            bottom: 15px;
            width: 280px;
            background-color: var(--panel-bg);
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6);
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .floating-panel.active {
            display: flex;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .panel-close-btn {
            background: transparent;
            border: none;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
        }
        .panel-close-btn:hover {
            color: #fff;
        }

        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .sidebar-input, .sidebar-textarea {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .sidebar-textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .dict-icon-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }
        .dict-icon-btn {
            font-size: 13px;
            font-weight: bold;
            padding: 8px;
            text-align: center;
            background-color: #2c3e50;
        }
        #dict-preview-area {
            background: #151515;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-size: 13px;
            height: 180px;
            overflow-y: auto;
            color: #eee;
            line-height: 1.5;
        }
        .preview-placeholder {
            color: #666;
            font-style: italic;
        }

        .replace-btn { background-color: #5c3b4d; color: #ffdde5; font-weight: bold; width: 100%; }
        .replace-btn:hover { background-color: #804d65; }
        .save-btn { background-color: #3b3b5c; color: #ddddff; font-weight: bold; width: 100%; margin-top: 5px;}
        
        .load-label {
            background-color: #2a3a3a;
            color: #aaffff;
            font-weight: bold;
            text-align: center;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 13px;
            display: block;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .load-label:hover { background-color: #3b5c5c; }

        #yt-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .btn-row { display: flex; gap: 5px; margin-bottom: 8px; }
        .btn-row button { flex: 1; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

        /* --- 右側：メイン執筆エリア --- */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            box-sizing: border-box;
            z-index: 5;
        }

        #top-phrase-panel {
            width: 100%;
            max-width: 720px;
            background-color: #181818;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .phrase-main-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }
        .phrase-horizontal-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .phrase-horizontal-list::-webkit-scrollbar { height: 4px; }
        .phrase-horizontal-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        
        .phrase-chip {
            display: flex;
            align-items: center;
            background: #2b2b2b;
            border: 1px solid #444;
            border-radius: 4px;
            white-space: nowrap;
        }
        .phrase-chip-btn {
            background: transparent;
            border: none;
            color: #eee;
            padding: 4px 8px;
            font-size: 13px;
        }
        .phrase-chip-btn:hover { background: var(--accent-color); color: #fff; }
        .phrase-chip-del {
            background: #442222; border: none; color: #ffaaaa;
            padding: 4px 6px; cursor: pointer; border-radius: 0 3px 3px 0; font-size: 11px;
        }
        .phrase-chip-del:hover { background: #662222; }

        #editor-wrapper {
            width: 100%;
            max-width: 720px;
            flex: 1;
            margin: 10px 0;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        #quick-toolbar {
            display: flex;
            gap: 6px;
            padding: 10px 20px;
            background-color: #181818;
            border-bottom: 1px solid var(--border-color);
            border-radius: 4px 4px 0 0;
        }
        .quick-btn {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #eee;
            padding: 4px 12px;
            font-size: 14px;
            font-family: 'Shippori Mincho', serif;
            min-width: 38px;
            text-align: center;
        }

        #editor {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: #dddddd;
            padding: 30px 40px 40px 40px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            font-family: 'Shippori Mincho', serif;
            font-size: 17px;
            line-height: 1.8;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        #editor-footer {
            padding: 10px 20px;
            background-color: #151515;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        #bottom-page-panel {
            width: 100%;
            max-width: 720px;
            background-color: #181818;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .page-scroll-container {
            flex: 1;
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 2px 0;
        }
        .page-scroll-container::-webkit-scrollbar { height: 4px; }
        .page-scroll-container::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        
        .page-btn { padding: 6px 12px; background-color: #333; border: 1px solid #444; color: #fff; min-width: 35px; text-align: center; }
        .page-btn.active { background-color: var(--accent-color); color: #fff; font-weight: bold; }
        .add-page-btn { background-color: #2a3a2a; color: #aaffaa; white-space: nowrap; }
        .del-page-btn { background-color: #3d2222; color: #ffaaaa; white-space: nowrap; }
        
        .jump-btn {
            background-color: #2c3e50;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .jump-btn:hover {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- 左側：アイコンツールパレット（サイズ半分＆潰れ対策完了） -->
    <div id="sidebar-palette">
        <div class="palette-icon-btn" data-tooltip="辞書機能" onclick="togglePanel('panel-dict')">🔍</div>
        <div class="palette-icon-btn" data-tooltip="文字置き換え" onclick="togglePanel('panel-replace')">✒️</div>
        <div class="palette-icon-btn" data-tooltip="作品メモ" onclick="togglePanel('panel-memo')">📝</div>
        <div class="palette-icon-btn" data-tooltip="ミニYouTube" onclick="togglePanel('panel-youtube')">🎬</div>
        <div class="palette-icon-btn" data-tooltip="画面・配色設定" onclick="togglePanel('panel-settings')">🎨</div>
        <div class="palette-icon-btn" data-tooltip="作品出力・読込" onclick="togglePanel('panel-save')">💾</div>
    </div>

    <!-- ポップアップパネル群 -->
    <!-- 1. 辞書 -->
    <div class="floating-panel" id="panel-dict">
        <div class="panel-header">
            <div class="panel-title">🔍 言葉の意味を調べる</div>
            <button class="panel-close-btn" onclick="closeAllPanels()">×</button>
        </div>
        <div class="dict-icon-row">
            <button class="dict-icon-btn" onclick="searchWordInline('kotobank')" title="国語辞書意味">📘 コ</button>
            <button class="dict-icon-btn" onclick="searchWordInline('weblio')" title="類語・関連表現">📚 辞</button>
            <button class="dict-icon-btn" onclick="resetDictInline()" style="background-color:#444;" title="リセット">🔄 リ</button>
        </div>
        <div id="dict-preview-area">
            <span class="preview-placeholder">本文で文字を選択して、上のアイコンを押すとここに簡易表示されます。</span>
        </div>
    </div>

    <!-- 2. 置き換え -->
    <div class="floating-panel" id="panel-replace">
        <div class="panel-header">
            <div class="panel-title">✒️ 文字の一括置き換え</div>
            <button class="panel-close-btn" onclick="closeAllPanels()">×</button>
        </div>
        <input type="text" id="replace-src" class="sidebar-input" placeholder="置き換え前の文字（消したい文字）">
        <input type="text" id="replace-dst" class="sidebar-input" placeholder="置き換え後の文字（新しい文字）">
        <button class="replace-btn" onclick="replaceAllText()">すべてのページを置き換える</button>
    </div>

    <!-- 3. メモ -->
    <div class="floating-panel" id="panel-memo">
        <div class="panel-header">
            <div class="panel-title">📝 作品メモ</div>
            <button class="panel-close-btn" onclick="closeAllPanels()">×</button>
        </div>
        <textarea id="memo-area" class="sidebar-textarea" placeholder="プロットや設定メモ（自動保存）" oninput="saveMemo()"></textarea>
    </div>

    <!-- 4. ミニYouTube -->
    <div class="floating-panel" id="panel-youtube">
        <div class="panel-header">
            <div class="panel-title">🎬 ミニYouTube</div>
            <button class="panel-close-btn" onclick="closeAllPanels()">×</button>
        </div>
        <input type="text" id="yt-url-input" class="sidebar-input" placeholder="動画ID または URL を入力">
        <button style="width:100%;" onclick="loadYouTubeVideo()">プレイヤーに読み込み</button>
        <div id="yt-container">
            <div style="color:#555; text-align:center; padding-top:25px; font-size:12px;">動画未読込</div>
        </div>
    </div>

    <!-- 5. 設定 -->
    <div class="floating-panel" id="panel-settings">
        <div class="panel-header">
            <div class="panel-title">🎨 表示・カラー設定</div>
            <button class="panel-close-btn" onclick="closeAllPanels()">×</button>
        </div>
        <select id="font-selector" class="sidebar-input" style="margin-bottom:8px;" onchange="changeFontFamily(this.value)">
            <option value="'Shippori Mincho', serif">しっぽり明朝（濁点対応）</option>
            <option value="'M PLUS Round 1c', sans-serif">かわいめ丸ゴシック</option>
            <option value="'Helvetica Neue', Arial, sans-serif">標準ゴシック体</option>
        </select>
        <div class="btn-row">
            <button onclick="changeFontSize('14px')">小</button>
            <button onclick="changeFontSize('17px')">中</button>
            <button onclick="changeFontSize('22px')">大</button>
        </div>
        <div class="color-picker-group">
            <span style="font-size:12px; width:55px;">背景色:</span>
            <input type="text" id="bg-color-code" class="sidebar-input" style="margin:0;" value="#1e1e1e" placeholder="#1e1e1e" oninput="applyCustomColors()">
        </div>
        <div class="color-picker-group">
            <span style="font-size:12px; width:55px;">文字色:</span>
            <input type="text" id="text-color-code" class="sidebar-input" style="margin:0;" value="#dddddd" placeholder="#dddddd" oninput="applyCustomColors()">
        </div>
    </div>

    <!-- 6. 保存・読込 -->
    <div class="floating-panel" id="panel-save">
        <div class="panel-header">
            <div class="panel-title">💾 作品出力と読み込み</div>
            <button class="panel-close-btn" onclick="closeAllPanels()">×</button>
        </div>
        <input type="text" id="file-name-input" class="sidebar-input" value="novel_draft" placeholder="ファイル名を入力">
        <button class="save-btn" onclick="exportToTxt()">.txt形式で全ページ保存</button>
        
        <label for="file-loader" class="load-label">📁 続きから書く（txt読込）</label>
        <input type="file" id="file-loader" accept=".txt" style="display:none;" onchange="importFromTxt(this)">
    </div>


    <!-- 右側：メイン執筆エリア -->
    <div id="main-container">
        <!-- 上部：定型文管理パネル -->
        <div id="top-phrase-panel">
            <div class="phrase-main-block">
                <input type="text" id="new-phrase-input" class="sidebar-input" style="margin:0;" placeholder="文章を入力してEnterで定型文に登録">
                <div class="phrase-horizontal-list" id="phrase-container"></div>
            </div>
            <button class="jump-btn" onclick="scrollToElement('bottom-page-panel')" title="一番下へジャンプ">↓</button>
        </div>

        <!-- 中央：エディタ本体 -->
        <div id="editor-wrapper">
            <div id="quick-toolbar">
                <button class="quick-btn" onclick="insertQuickText('「」')">「」</button>
                <button class="quick-btn" onclick="insertQuickText('――')">――</button>
                <button class="quick-btn" onclick="insertQuickText('……')">……</button>
                <button class="quick-btn" onclick="insertQuickText('゛')">゛</button>
                <button class="quick-btn" onclick="insertQuickText('♡')">♡</button>
                <button class="quick-btn" onclick="insertQuickText('ッ')">ッ</button>
                <button class="quick-btn" onclick="insertQuickText('▼▼▼')">▼▼▼</button>
            </div>
            
            <textarea id="editor" placeholder="ここに小説を書き出せます..." oninput="updatePageData()" onselect="handleTextSelection()"></textarea>
            <div id="editor-footer">
                <span id="current-page-display">ページ: 1</span>
                <span id="char-count-display">0 文字</span>
            </div>
        </div>

        <!-- 下部：ページ管理パネル -->
        <div id="bottom-page-panel">
            <button class="add-page-btn" onclick="addNewPage()">＋ 新規ページ</button>
            <div class="page-scroll-container" id="page-container"></div>
            <button class="del-page-btn" onclick="deleteCurrentPage()">ページ削除</button>
            <button class="jump-btn" onclick="scrollToElement('top-phrase-panel')" title="一番上へジャンプ">↑</button>
        </div>
    </div>

    <script>
        let pages = [""];
        let currentPageIndex = 0;
        let selectedText = "";

        let customPhrases = JSON.parse(localStorage.getItem('novel_phrases')) || [
            "同数くらいで考え中",
            "息を呑んだ。",
            "あ゛っ、"
        ];

        const editor = document.getElementById('editor');
        const editorWrapper = document.getElementById('editor-wrapper');
        const pageContainer = document.getElementById('page-container');
        const phraseContainer = document.getElementById('phrase-container');
        const memoArea = document.getElementById('memo-area');
        const previewArea = document.getElementById('dict-preview-area');

        window.onload = function() {
            if (localStorage.getItem('novel_saved_pages')) {
                pages = JSON.parse(localStorage.getItem('novel_saved_pages'));
                currentPageIndex = Number(localStorage.getItem('novel_current_page_idx')) || 0;
            } else {
                pages = [""];
                currentPageIndex = 0;
            }

            renderPages();
            renderPhrases();
            loadPage(currentPageIndex);
            
            if(localStorage.getItem('custom_font_family')) {
                const font = localStorage.getItem('custom_font_family');
                document.getElementById('font-selector').value = font;
                changeFontFamily(font);
            }
            if(localStorage.getItem('custom_font_size')) {
                changeFontSize(localStorage.getItem('custom_font_size'));
            }
            if(localStorage.getItem('custom_bg_color')) {
                document.getElementById('bg-color-code').value = localStorage.getItem('custom_bg_color');
            }
            if(localStorage.getItem('custom_text_color')) {
                document.getElementById('text-color-code').value = localStorage.getItem('custom_text_color');
            }
            applyCustomColors();

            if(localStorage.getItem('novel_memo')) {
                memoArea.value = localStorage.getItem('novel_memo');
            }
            if(localStorage.getItem('novel_yt_id')) {
                document.getElementById('yt-url-input').value = localStorage.getItem('novel_yt_id');
                loadYouTubeVideo();
            }

            document.getElementById('new-phrase-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim() !== "") {
                    customPhrases.push(this.value.trim());
                    localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
                    this.value = "";
                    renderPhrases();
                }
            });
        };

        function scrollToElement(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function togglePanel(panelId) {
            const targetPanel = document.getElementById(panelId);
            const isOpen = targetPanel.style.display === 'flex';
            
            closeAllPanels();

            if (!isOpen) {
                targetPanel.style.display = 'flex';
                const iconButtons = document.querySelectorAll('.palette-icon-btn');
                const indexMap = { 'panel-dict':0, 'panel-replace':1, 'panel-memo':2, 'panel-youtube':3, 'panel-settings':4, 'panel-save':5 };
                if(indexMap[panelId] !== undefined) {
                    iconButtons[indexMap[panelId]].classList.add('active');
                }
            }
        }

        function closeAllPanels() {
            document.querySelectorAll('.floating-panel').forEach(panel => {
                panel.style.display = 'none';
            });
            document.querySelectorAll('.palette-icon-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }

        function applyCustomColors() {
            const bgColor = document.getElementById('bg-color-code').value.trim();
            const textColor = document.getElementById('text-color-code').value.trim();

            if (bgColor.match(/^#[0-9a-fA-F]{3,6}$/) || bgColor === "transparent") {
                editorWrapper.style.backgroundColor = bgColor;
                localStorage.setItem('custom_bg_color', bgColor);
            }
            if (textColor.match(/^#[0-9a-fA-F]{3,6}$/)) {
                editor.style.color = textColor;
                localStorage.setItem('custom_text_color', textColor);
            }
        }

        function replaceAllText() {
            const srcText = document.getElementById('replace-src').value;
            const dstText = document.getElementById('replace-dst').value;

            if (!srcText) {
                alert("置き換え前の文字を入力してください。");
                return;
            }

            pages[currentPageIndex] = editor.value;
            const escapedSrc = srcText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(escapedSrc, 'g');

            let totalCount = 0;
            pages = pages.map((pageText) => {
                const matches = pageText.match(regex);
                if (matches) totalCount += matches.length;
                return pageText.replace(regex, dstText);
            });

            editor.value = pages[currentPageIndex];
            updatePageData();
            alert(`全ページから「${srcText}」を「${dstText}」に一括置き換えしました（計 ${totalCount} 箇所）。`);
            document.getElementById('replace-src').value = "";
            document.getElementById('replace-dst').value = "";
        }

        function handleTextSelection() {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value.substring(start, end).trim();
            if (text && start !== end) { selectedText = text; }
        }

        function searchWordInline(type) {
            if (!selectedText) {
                previewArea.innerHTML = `<span style="color:#e74c3c;">⚠️ 本文の文字を選択してから押してください。</span>`;
                return;
            }
            const currentFont = editor.style.fontFamily || "'Shippori Mincho', serif";
            
            if (type === 'kotobank') {
                previewArea.innerHTML = `<span style="color:#3498db;">🔍 国語辞典で検索中...</span>`;
                fetch(`https://ja.wiktionary.org/api/rest_v1/page/summary/${encodeURIComponent(selectedText)}`)
                    .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                    .then(data => {
                        if (data.extract) {
                            previewArea.innerHTML = `<div style="font-family: ${currentFont}; line-height: 1.6;"><div style="font-weight:bold; color:#2ecc71; margin-bottom:8px; border-bottom: 1px solid #444; padding-bottom:3px;">📘 「${selectedText}」の意味</div><div style="font-size:14px; color:#eee; white-space:pre-wrap;">${data.extract}</div></div>`;
                        } else { showExternalLink('kotobank', currentFont); }
                    }).catch(() => showExternalLink('kotobank', currentFont));
            } 
            else if (type === 'weblio') {
                previewArea.innerHTML = `<span style="color:#9b59b6;">🔍 類語辞典で検索中...</span>`;
                fetch(`https://ja.wikipedia.org/api/rest_v1/page/related/${encodeURIComponent(selectedText)}`)
                    .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                    .then(data => {
                        if (data.pages && data.pages.length > 0) {
                            const relatedWords = data.pages.slice(0, 5).map(p => `・<b>${p.title}</b>：${p.description || '関連表現'}`).join('<br>');
                            previewArea.innerHTML = `<div style="font-family: ${currentFont}; line-height: 1.6;"><div style="font-weight:bold; color:#9b59b6; margin-bottom:8px; border-bottom: 1px solid #444; padding-bottom:3px;">📚 「${selectedText}」の類語・関連語</div><div style="font-size:13px; color:#eee; white-space:pre-wrap;">${relatedWords}</div></div>`;
                        } else { showExternalLink('weblio', currentFont); }
                    }).catch(() => showExternalLink('weblio', currentFont));
            }
        }

        function showExternalLink(type, currentFont) {
            let searchUrl = (type === 'kotobank') ? `https://kotobank.jp/word/${encodeURIComponent(selectedText)}` : `https://thesaurus.weblio.jp/content/${encodeURIComponent(selectedText)}`;
            let siteName = (type === 'kotobank') ? "コトバンク" : "Weblio類語辞典";
            previewArea.innerHTML = `<div style="font-family: ${currentFont};"><div style="font-weight:bold; color:#e67e22; margin-bottom:5px;">⚠️ 自動抽出できませんでした</div><button onclick="window.open('${searchUrl}', '_blank')" style="width:100%; background:#2c3e50; text-align:center; padding:8px; color:#fff; border:none; border-radius:4px;">🔗 ${siteName} で直接調べる</button></div>`;
        }

        function resetDictInline() {
            selectedText = "";
            previewArea.innerHTML = `<span class="preview-placeholder">本文で文字を選択して、上のアイコンを押すとここに簡易表示されます。</span>`;
        }

        function insertQuickText(text) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const currentVal = editor.value;

            if (text === '「」') {
                const selected = currentVal.substring(start, end);
                editor.value = currentVal.substring(0, start) + "「" + selected + "」" + currentVal.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 1 + selected.length;
            } else {
                editor.value = currentVal.substring(0, start) + text + currentVal.substring(end);
                editor.selectionStart = editor.selectionEnd = start + text.length;
            }
            updatePageData();
            editor.focus();
        }

        function loadYouTubeVideo() {
            const inputVal = document.getElementById('yt-url-input').value.trim();
            if(!inputVal) return;
            let videoId = inputVal;
            if(inputVal.includes('v=')) { videoId = inputVal.split('v=')[1].split('&')[0]; }
            else if(inputVal.includes('youtu.be/')) { videoId = inputVal.split('youtu.be/')[1].split('?')[0]; }

            if(videoId) {
                document.getElementById('yt-container').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                localStorage.setItem('novel_yt_id', inputVal);
            }
        }

        function renderPages() {
            pageContainer.innerHTML = "";
            pages.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.className = `page-btn ${index === currentPageIndex ? 'active' : ''}`;
                btn.innerText = index + 1;
                btn.onclick = () => loadPage(index);
                pageContainer.appendChild(btn);
            });
        }

        function loadPage(index) {
            pages[currentPageIndex] = editor.value;
            currentPageIndex = index;
            editor.value = pages[currentPageIndex] || "";
            renderPages();
            document.getElementById('current-page-display').innerText = `ページ: ${currentPageIndex + 1} / ${pages.length}`;
            document.getElementById('char-count-display').innerText = `${editor.value.length} 文字`;
            localStorage.setItem('novel_current_page_idx', currentPageIndex);
            resetDictInline();
            editor.focus();
        }

        function addNewPage() {
            pages[currentPageIndex] = editor.value;
            pages.push(""); 
            loadPage(pages.length - 1);
            localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
        }

        function deleteCurrentPage() {
            if (pages.length <= 1) { alert("これ以上ページを削除できません。"); return; }
            if (!confirm(`現在のページ（${currentPageIndex + 1}ページ目）を削除してもよろしいですか？`)) return;
            pages.splice(currentPageIndex, 1);
            if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;
            localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
            loadPage(currentPageIndex);
        }

        function updatePageData() {
            pages[currentPageIndex] = editor.value;
            document.getElementById('current-page-display').innerText = `ページ: ${currentPageIndex + 1} / ${pages.length}`;
            document.getElementById('char-count-display').innerText = `${editor.value.length} 文字`;
            localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
        }

        function changeFontFamily(fontName) {
            editor.style.fontFamily = fontName;
            document.querySelectorAll('.quick-btn').forEach(btn => btn.style.fontFamily = fontName);
            localStorage.setItem('custom_font_family', fontName);
        }

        function changeFontSize(size) {
            editor.style.fontSize = size;
            localStorage.setItem('custom_font_size', size);
        }

        function renderPhrases() {
            phraseContainer.innerHTML = "";
            customPhrases.forEach((phrase, index) => {
                const chip = document.createElement('div');
                chip.className = 'phrase-chip';
                const btn = document.createElement('button');
                btn.className = 'phrase-chip-btn';
                btn.innerText = phrase;
                btn.onclick = () => insertQuickText(phrase);
                const delBtn = document.createElement('button');
                delBtn.className = 'phrase-chip-del';
                delBtn.innerText = '×';
                delBtn.onclick = (e) => { e.stopPropagation(); deletePhrase(index); };
                chip.appendChild(btn);
                chip.appendChild(delBtn);
                phraseContainer.appendChild(chip);
            });
        }

        function deletePhrase(index) {
            customPhrases.splice(index, 1);
            localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
            renderPhrases();
        }

        function saveMemo() { localStorage.setItem('novel_memo', memoArea.value); }

        function exportToTxt() {
            pages[currentPageIndex] = editor.value;
            const joinedText = pages.map((pageText, index) => `--- 【${index + 1}ページ目】 ---\n${pageText}`).join('\n\n');
            const blob = new Blob([joinedText], { type: 'text/plain;charset=utf-8' });
            const name = document.getElementById('file-name-input').value.trim() || "novel_draft";
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${name}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importFromTxt(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fullText = e.target.result;
                const sections = fullText.split(/--- 【\d+ページ目】 ---\n/);
                let newPages = sections.map(s => s.trim()).filter((s, idx) => !(idx === 0 && s === ""));
                if (newPages.length === 0) newPages = [fullText];
                pages = newPages;
                currentPageIndex = 0;
                localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
                loadPage(0);
                alert(`全 ${pages.length} ページ分を読み込みました。`);
                input.value = ""; 
            };
            reader.readAsText(file, 'utf-8');
        }
    </script>
</body>
</html>
