<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>rei-style Editor (Integrated)</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #cccccc; --sidebar-bg: #242424; 
            --panel-bg: #2c2c2c; --border-color: #333333; --accent-color: #4a90e2; 
            --editor-bg: #1e1e1e; --input-bg: #1a1a1a;
        }
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; transition: background-color 0.2s; }
        
        /* 押し出し構造 */
        #sidebar-palette { width: 60px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 15px 0; z-index: 1000; flex-shrink: 0; }
        .palette-icon-btn { cursor: pointer; padding: 10px; font-size: 20px; }
        #main-container { flex: 1; display: flex; flex-direction: column; padding: 20px; transition: margin-left 0.3s ease; position: relative; overflow: hidden; }
        body.panel-open #main-container { margin-left: 300px; }

        /* パネル */
        .floating-panel { position: absolute; left: 60px; top: 0; width: 300px; height: 100vh; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: none; flex-direction: column; padding: 20px; z-index: 999; box-sizing: border-box; }
        .floating-panel.active { display: flex; }
        
        /* エディタと入力要素 */
        #editor { flex: 1; width: 100%; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 20px; resize: none; }
        .sidebar-input, .sidebar-textarea, #font-selector { width: 100%; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="sidebar-palette">
        <div class="palette-icon-btn" onclick="togglePanel('panel-dict')">🔍</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-replace')">🔁</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-memo')">✒️</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-youtube')">🎬</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-settings')">🖌️</div>
        <div class="palette-icon-btn" onclick="togglePanel('panel-save')">🔖</div>
    </div>

    <div class="floating-panel" id="panel-dict"><div class="panel-header">辞書 <button onclick="closeAllPanels()">×</button></div></div>
    <div class="floating-panel" id="panel-replace"><div class="panel-header">置換 <button onclick="closeAllPanels()">×</button></div><input class="sidebar-input" id="rep-src"><input class="sidebar-input" id="rep-dst"><button onclick="executeReplace()">置換実行</button></div>
    <div class="floating-panel" id="panel-memo"><div class="panel-header">メモ <button onclick="closeAllPanels()">×</button></div><textarea class="sidebar-textarea" id="memo"></textarea></div>
    <div class="floating-panel" id="panel-youtube"><div class="panel-header">動画 <button onclick="closeAllPanels()">×</button></div><input class="sidebar-input" id="yt-url"></div>
    <div class="floating-panel" id="panel-settings"><div class="panel-header">設定 <button onclick="closeAllPanels()">×</button></div>
        <select id="font-selector" onchange="applyFont(this.value)">
            <option value="serif">明朝体</option>
            <option value="sans-serif">ゴシック体</option>
        </select>
        <button class="theme-select-btn" onclick="applyTheme('default')">デフォルト黒</button>
        <button class="theme-select-btn" onclick="applyTheme('craftpaper')">クラフトペーパー</button>
    </div>
    <div class="floating-panel" id="panel-save"><div class="panel-header">保存 <button onclick="closeAllPanels()">×</button></div><button onclick="exportToTxt()">保存</button></div>

    <div id="main-container">
        <textarea id="editor" oninput="updatePageData()"></textarea>
        <div id="page-container"></div>
        <button onclick="addNewPage()">＋追加</button>
    </div>

    <script>
        let pages = [""], currentPageIndex = 0;
        const editor = document.getElementById('editor');

        function togglePanel(id) {
            const panel = document.getElementById(id);
            const isOpen = panel.classList.contains('active');
            document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active'));
            document.body.classList.remove('panel-open');
            if (!isOpen) { panel.classList.add('active'); document.body.classList.add('panel-open'); }
        }
        function closeAllPanels() { document.body.classList.remove('panel-open'); document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active')); }

        function updatePageData() { pages[currentPageIndex] = editor.value; localStorage.setItem('novel_saved_pages', JSON.stringify(pages)); }
        
        function applyTheme(t) {
            const themes = {
                'default': { bg: '#1a1a1a', text: '#cccccc', side: '#242424', panel: '#2c2c2c', border: '#333333' },
                'craftpaper': { bg: '#f1ebd9', text: '#4a3c31', side: '#e6dfca', panel: '#fcfaf5', border: '#dcd1b5' }
            };
            const c = themes[t] || themes['default'];
            const root = document.documentElement;
            root.style.setProperty('--bg-color', c.bg);
            root.style.setProperty('--text-color', c.text);
            root.style.setProperty('--sidebar-bg', c.side);
            root.style.setProperty('--panel-bg', c.panel);
            root.style.setProperty('--border-color', c.border);
            root.style.setProperty('--input-bg', c.bg); // 入力欄を背景色に同期
            localStorage.setItem('active_theme', t);
        }

        function addNewPage() { pages.push(""); currentPageIndex = pages.length - 1; editor.value = ""; }
        function applyFont(f) { editor.style.fontFamily = f; localStorage.setItem('custom_font', f); }
        function executeReplace() { /* 置換ロジック */ }
        function exportToTxt() { /* 保存ロジック */ }

        window.onload = () => {
            if(localStorage.getItem('novel_saved_pages')) pages = JSON.parse(localStorage.getItem('novel_saved_pages'));
            editor.value = pages[0];
            applyTheme(localStorage.getItem('active_theme') || 'default');
        };
    </script>
</body>
</html>
