<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Palette Layout v24)</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Emoji&display=swap" rel="stylesheet">
    <style>
        /* --- 強制モノクロ化（カラー絵文字の抑制） --- */
        /* 絵文字をカラーにさせず、必ずテキスト色（var(--text-color)）に追従させるための最強設定 */
        * {
            font-variant-emoji: text !important;
            -webkit-font-variant-emoji: text !important;
        }

        :root {
            --bg-color: #1a1a1a;
            --text-color: #cccccc;
            --sidebar-bg: #242424;
            --panel-bg: #2c2c2c;
            --border-color: #333333;
            --accent-color: #4a90e2;
            --button-hover: #357abd;
            --editor-bg: #1e1e1e;
            --panel-header-border: #444;
            --input-bg: #111;
            --ruby-color: #a5c7f2;
        }

        /* テーマ切り替え用のCSS変数定義は省略（前回と同じものをそのまま使用してください） */
        body.theme-default-white { --bg-color: #f5f5f5; --text-color: #333333; --sidebar-bg: #e0e0e0; --panel-bg: #ffffff; --border-color: #cccccc; --accent-color: #3498db; --editor-bg: #ffffff; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Noto Emojiを先頭に置くことで、OS標準のカラー絵文字フォントの読み込みを回避 */
            font-family: 'Noto Emoji', "Helvetica Neue", Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* アイコンボタン系は特に色が化けやすいので、明示的に色を固定 */
        .palette-icon-btn, .jump-btn, .quick-btn {
            color: var(--text-color) !important;
            fill: var(--text-color) !important;
        }

        /* --- （以降、前回のコードのCSSおよびHTML構造・JavaScriptをすべてそのまま記述してください） --- */
