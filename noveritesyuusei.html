<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rei-style Editor (Palette Layout + All Functions)</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Round+1c:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    
    <style>
        /* --- カラーテーマの変数定義群 --- */
        :root {
            --bg-color: #1a1a1a;
            --text-color: #cccccc;
            --sidebar-bg: #242424;
            --panel-bg: #2c2c2c;
            --border-color: #333333;
            --accent-color: #4a90e2;
            --button-hover: #357abd;
            --editor-bg: #1e1e1e;
            --panel-header-border: #444;
            --input-bg: #111;
        }

        body.theme-default-white {
            --bg-color: #f5f5f5; --text-color: #333333; --sidebar-bg: #e0e0e0; --panel-bg: #ffffff;
            --border-color: #cccccc; --accent-color: #3498db; --button-hover: #2980b9; --editor-bg: #ffffff;
            --panel-header-border: #dddddd; --input-bg: #fafafa;
        }
        body.theme-coffeebrown {
            --bg-color: #4a3e3d; --text-color: #f4f1ea; --sidebar-bg: #3d3231; --panel-bg: #5a4d4c;
            --border-color: #2e2524; --accent-color: #bfa18f; --button-hover: #a68574; --editor-bg: #524645;
            --panel-header-border: #3d3231; --input-bg: #2e2524;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden; position: relative;
            transition: background-color 0.2s, color 0.2s;
        }

        /* --- 左側：テキストツールパレット --- */
        #sidebar-palette {
            width: 56px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; padding: 15px 0; box-sizing: border-box; gap: 10px; z-index: 10;
        }

        .palette-spacer { flex: 1; }

        .palette-icon-btn {
            width: 44px; height: 38px; border-radius: 6px; background-color: rgba(0,0,0,0.15); border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; position: relative;
            font-size: 18px; color: var(--text-color);
        }
        .palette-icon-btn:hover, .palette-icon-btn.active {
            background-color: var(--accent-color); border-color: #555; transform: scale(1.05); color: #ffffff;
        }
        .palette-icon-btn::after {
            content: attr(data-tooltip); position: absolute; left: 54px; top: 50%; transform: translateY(-50%); background: #000; color: #fff;
            padding: 5px 9px; border-radius: 4px; font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif;
        }
        .palette-icon-btn:hover::after { opacity: 1; z-index: 30; }

        /* --- ポップアップする機能パネル --- */
        .floating-panel {
            position: absolute; left: 62px; top: 15px; bottom: 15px; width: 300px;
            background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.4); z-index: 20; display: none; flex-direction: column; padding: 15px; box-sizing: border-box; overflow-y: auto;
        }
        .floating-panel.active { display: flex; }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-header-border); padding-bottom: 8px; margin-bottom: 12px;
        }
        .panel-title { font-size: 14px; font-weight: bold; color: var(--text-color); }
        .panel-close-btn { background: transparent; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; padding: 0 4px; }
        .panel-close-btn:hover { color: var(--accent-color); }

        /* --- 各種UIパーツ --- */
        button {
            background-color: rgba(0,0,0,0.2); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s;
        }
        button:hover { background-color: var(--accent-color); color: #fff; }

        .sidebar-input, .sidebar-textarea, select {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 8px; box-sizing: border-box; border-radius: 4px; font-size: 13px; margin-bottom: 8px;
        }
        .sidebar-textarea { resize: vertical; min-height: 120px; font-family: inherit; }

        .dict-icon-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .dict-icon-btn { font-size: 13px; font-weight: bold; padding: 8px; background-color: #2c3e50; }
        
        #dict-preview-area {
            background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px;
            padding: 10px; font-size: 13px; max-height: 200px; overflow-y: auto; color: var(--text-color); line-height: 1.5;
        }
        
        .page-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        .page-btn.active { background-color: var(--accent-color); color: #fff; font-weight: bold; }
        .add-page-btn { background-color: #2a3a2a; color: #aaffaa; width: 100%; }

        .replace-group { display: flex; flex-direction: column; gap: 5px; }
        .replace-btn { background-color: #5c3b4d; color: #ffdde5; font-weight: bold; margin-top: 5px; }

        .phrase-list { display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto; }
        .phrase-item { display: flex; gap: 5px; }
        .phrase-btn { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .delete-btn { background-color: #552222; color: #ffaaaa; padding: 6px 10px; }

        .save-btn { background-color: #3b3b5c; color: #ddddff; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .load-label {
            background-color: #2a3a3a; color: #aaffff; font-weight: bold; text-align: center;
            padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; display: block;
        }

        .theme-grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .theme-btn { font-size: 12px; padding: 5px; text-align: center; }

        /* --- 右側：メイン執筆エリア --- */
        #main-container {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 40px; box-sizing: border-box;
        }

        #editor-wrapper {
            width: 100%; max-width: 720px; height: 85vh; background-color: var(--editor-bg);
            border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px;
            display: flex; flex-direction: column; transition: background-color 0.3s;
        }

        #quick-toolbar {
            display: flex; gap: 6px; padding: 10px 20px; background-color: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--border-color); border-radius: 4px 4px 0 0; overflow-x: auto;
        }
        .quick-btn {
            background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 4px 12px; font-size: 14px; min-width: 38px; text-align: center;
        }

        #editor {
            flex: 1; width: 100%; background: transparent; border: none; color: var(--text-color);
            padding: 30px 40px 40px 40px; box-sizing: border-box; resize: none; outline: none;
            font-family: 'Shippori Mincho', serif; font-size: 17px; line-height: 1.8; letter-spacing: 0.05em; transition: color 0.3s;
        }

        #editor-footer {
            padding: 10px 20px; background-color: rgba(0,0,0,0.1); border-top: 1px solid var(--border-color);
            font-size: 12px; color: var(--text-color); display: flex; justify-content: space-between; opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- パレットメニュー -->
    <div id="sidebar-palette">
        <button class="palette-icon-btn" data-tooltip="辞書・類語" onclick="togglePanel('panel-dict')">📘</button>
        <button class="palette-icon-btn" data-tooltip="文字一括置換" onclick="togglePanel('panel-replace')">🔄</button>
        <button class="palette-icon-btn" data-tooltip="定型文登録" onclick="togglePanel('panel-phrases')">📝</button>
        <button class="palette-icon-btn" data-tooltip="ページ管理" onclick="togglePanel('panel-pages')">📄</button>
        <button class="palette-icon-btn" data-tooltip="表示・テーマ" onclick="togglePanel('panel-settings')">⚙️</button>
        
        <div class="palette-spacer"></div>
        
        <button class="palette-icon-btn" data-tooltip="保存と読込" onclick="togglePanel('panel-save')">💾</button>
        <button class="palette-icon-btn" data-tooltip="作品メモ" onclick="togglePanel('panel-memo')">📓</button>
    </div>

    <!-- 各機能のフローティングパネル -->
    <div id="panel-dict" class="floating-panel">
        <div class="panel-header"><span class="panel-title">言葉の意味を調べる</span><button class="panel-close-btn" onclick="togglePanel('panel-dict')">×</button></div>
        <div class="dict-icon-row">
            <button class="dict-icon-btn" onclick="searchWordInline('kotobank')">📘 コ</button>
            <button class="dict-icon-btn" onclick="searchWordInline('weblio')">📚 辞</button>
            <button class="dict-icon-btn" onclick="resetDictInline()" style="background-color:#444;">🔄 リ</button>
        </div>
        <div id="dict-preview-area">本文で文字を選択して、上のアイコンを押すとここに簡易表示されます。</div>
    </div>

    <div id="panel-replace" class="floating-panel">
        <div class="panel-header"><span class="panel-title">文字の置き換え（一括）</span><button class="panel-close-btn" onclick="togglePanel('panel-replace')">×</button></div>
        <div class="replace-group">
            <input type="text" id="replace-src" class="sidebar-input" placeholder="消したい文字">
            <input type="text" id="replace-dst" class="sidebar-input" placeholder="新しい文字">
            <button class="replace-btn" onclick="replaceAllText()">すべてのページを置き換える</button>
        </div>
    </div>

    <div id="panel-phrases" class="floating-panel">
        <div class="panel-header"><span class="panel-title">よく使う単語・文章登録</span><button class="panel-close-btn" onclick="togglePanel('panel-phrases')">×</button></div>
        <input type="text" id="new-phrase-input" class="sidebar-input" placeholder="文章を入力してEnterで登録">
        <div class="phrase-list" id="phrase-container"></div>
    </div>

    <div id="panel-pages" class="floating-panel">
        <div class="panel-header"><span class="panel-title">ページ管理</span><button class="panel-close-btn" onclick="togglePanel('panel-pages')">×</button></div>
        <div class="page-grid" id="page-container"></div>
        <button class="add-page-btn" onclick="addNewPage()">＋ 新しいページを追加</button>
    </div>

    <div id="panel-settings" class="floating-panel">
        <div class="panel-header"><span class="panel-title">表示・カラー設定</span><button class="panel-close-btn" onclick="togglePanel('panel-settings')">×</button></div>
        <label style="font-size:12px;">カラーテーマ:</label>
        <div class="theme-grid-container">
            <button class="theme-btn" onclick="setTheme('theme-default-dark')">ダーク(標準)</button>
            <button class="theme-btn" onclick="setTheme('theme-default-white')">ライト</button>
            <button class="theme-btn" onclick="setTheme('theme-coffeebrown')">コーヒー</button>
        </div>
        <label style="font-size:12px;">フォント設定:</label>
        <select id="font-selector" onchange="changeFontFamily(this.value)">
            <option value="'Shippori Mincho', serif">しっぽり明朝</option>
            <option value="'M PLUS Round 1c', sans-serif">かわいめ丸ゴシック</option>
            <option value="'Helvetica Neue', Arial, sans-serif">標準ゴシック体</option>
        </select>
        <div style="display:flex; gap:5px;">
            <button style="flex:1" onclick="changeFontSize('14px')">小</button>
            <button style="flex:1" onclick="changeFontSize('17px')">中</button>
            <button style="flex:1" onclick="changeFontSize('22px')">大</button>
        </div>
    </div>

    <div id="panel-save" class="floating-panel">
        <div class="panel-header"><span class="panel-title">作品出力と読み込み</span><button class="panel-close-btn" onclick="togglePanel('panel-save')">×</button></div>
        <input type="text" id="file-name-input" class="sidebar-input" value="novel_draft" placeholder="ファイル名を入力">
        <button class="save-btn" onclick="exportToTxt()">.txt形式で全ページ保存</button>
        <label for="file-loader" class="load-label">📁 続きから書く（txt読込）</label>
        <input type="file" id="file-loader" accept=".txt" style="display:none;" onchange="importFromTxt(this)">
    </div>

    <div id="panel-memo" class="floating-panel">
        <div class="panel-header"><span class="panel-title">作品メモ</span><button class="panel-close-btn" onclick="togglePanel('panel-memo')">×</button></div>
        <textarea id="memo-area" class="sidebar-textarea" placeholder="プロットや設定メモ（自動保存）" oninput="saveMemo()"></textarea>
    </div>

    <!-- メイン執筆エリア -->
    <div id="main-container">
        <div id="editor-wrapper">
            <div id="quick-toolbar">
                <button class="quick-btn" onclick="insertQuickText('「」')">「」</button>
                <button class="quick-btn" onclick="insertQuickText('――')">――</button>
                <button class="quick-btn" onclick="insertQuickText('……')">……</button>
                <button class="quick-btn" onclick="insertQuickText('゛')">゛</button>
                <button class="quick-btn" onclick="insertQuickText('♡')">♡</button>
                <button class="quick-btn" onclick="insertQuickText('ッ')">ッ</button>
                <button class="quick-btn" onclick="insertQuickText('▼▼▼')">▼▼▼</button>
            </div>
            
            <textarea id="editor" placeholder="ここに小説を書き出せます..." oninput="updatePageData()" onselect="handleTextSelection()"></textarea>
            
            <div id="editor-footer">
                <span id="current-page-display">ページ: 1</span>
                <span id="char-count-display">0 文字</span>
            </div>
        </div>
    </div>

    <script>
        // --- パネルトグル処理 ---
        let currentOpenPanel = null;
        function togglePanel(id) {
            const panel = document.getElementById(id);
            const btn = document.querySelector(`[onclick="togglePanel('${id}')"]`);
            
            // 他のパネルを閉じる
            if (currentOpenPanel && currentOpenPanel !== id) {
                document.getElementById(currentOpenPanel).classList.remove('active');
                const oldBtn = document.querySelector(`[onclick="togglePanel('${currentOpenPanel}')"]`);
                if(oldBtn) oldBtn.classList.remove('active');
            }
            
            // 選択したパネルの開閉
            panel.classList.toggle('active');
            if(panel.classList.contains('active')) {
                btn.classList.add('active');
                currentOpenPanel = id;
            } else {
                btn.classList.remove('active');
                currentOpenPanel = null;
            }
        }

        // --- データ・状態管理 ---
        let pages = [""];
        let currentPageIndex = 0;
        let selectedText = "";

        let customPhrases = JSON.parse(localStorage.getItem('novel_phrases')) || [
            "同数くらいで考え中", "息を呑んだ。", "あ゛っ、"
        ];

        const editor = document.getElementById('editor');
        const pageContainer = document.getElementById('page-container');
        const phraseContainer = document.getElementById('phrase-container');
        const memoArea = document.getElementById('memo-area');
        const previewArea = document.getElementById('dict-preview-area');

        // --- 画面読み込み時：自動保存データの復元 ---
        window.onload = function() {
            if (localStorage.getItem('novel_saved_pages')) {
                pages = JSON.parse(localStorage.getItem('novel_saved_pages'));
                currentPageIndex = Number(localStorage.getItem('novel_current_page_idx')) || 0;
            } else {
                pages = [""];
                currentPageIndex = 0;
            }

            renderPages();
            renderPhrases();
            loadPage(currentPageIndex);
            
            // テーマ復元
            const savedTheme = localStorage.getItem('novel_theme') || 'theme-default-dark';
            setTheme(savedTheme);

            if(localStorage.getItem('novel_memo')) {
                memoArea.value = localStorage.getItem('novel_memo');
            }

            document.getElementById('new-phrase-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim() !== "") {
                    customPhrases.push(this.value.trim());
                    localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
                    this.value = "";
                    renderPhrases();
                }
            });
        };

        // --- テーマ変更 ---
        function setTheme(themeName) {
            document.body.className = ''; 
            if(themeName !== 'theme-default-dark') {
                document.body.classList.add(themeName);
            }
            localStorage.setItem('novel_theme', themeName);
        }

        function changeFontFamily(fontName) {
            editor.style.fontFamily = fontName;
            document.querySelectorAll('.quick-btn').forEach(btn => btn.style.fontFamily = fontName);
        }

        function changeFontSize(size) {
            editor.style.fontSize = size;
        }

        // --- ページ管理機能 ---
        function renderPages() {
            pageContainer.innerHTML = "";
            pages.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.className = `page-btn ${index === currentPageIndex ? 'active' : ''}`;
                btn.innerText = index + 1;
                btn.onclick = () => loadPage(index);
                pageContainer.appendChild(btn);
            });
        }

        function loadPage(index) {
            pages[currentPageIndex] = editor.value;
            currentPageIndex = index;
            editor.value = pages[currentPageIndex] || "";
            renderPages();
            
            document.getElementById('current-page-display').innerText = `ページ: ${currentPageIndex + 1} / ${pages.length}`;
            document.getElementById('char-count-display').innerText = `${editor.value.length} 文字`;
            localStorage.setItem('novel_current_page_idx', currentPageIndex);
            editor.focus();
        }

        function addNewPage() {
            pages[currentPageIndex] = editor.value;
            pages.push(""); 
            loadPage(pages.length - 1);
            localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
        }

        function updatePageData() {
            pages[currentPageIndex] = editor.value;
            document.getElementById('current-page-display').innerText = `ページ: ${currentPageIndex + 1} / ${pages.length}`;
            document.getElementById('char-count-display').innerText = `${editor.value.length} 文字`;
            localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
        }

        // --- 定型文・入力機能 ---
        function insertQuickText(text) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const currentVal = editor.value;

            if (text === '「」') {
                const selected = currentVal.substring(start, end);
                editor.value = currentVal.substring(0, start) + "「" + selected + "」" + currentVal.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 1 + selected.length;
            } else {
                editor.value = currentVal.substring(0, start) + text + currentVal.substring(end);
                editor.selectionStart = editor.selectionEnd = start + text.length;
            }
            updatePageData();
            editor.focus();
        }

        function renderPhrases() {
            phraseContainer.innerHTML = "";
            customPhrases.forEach((phrase, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'phrase-item';

                const btn = document.createElement('button');
                btn.className = 'phrase-btn';
                btn.innerText = phrase;
                btn.title = phrase;
                btn.onclick = () => insertQuickText(phrase);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = '×';
                delBtn.onclick = () => {
                    customPhrases.splice(index, 1);
                    localStorage.setItem('novel_phrases', JSON.stringify(customPhrases));
                    renderPhrases();
                };

                wrapper.appendChild(btn);
                wrapper.appendChild(delBtn);
                phraseContainer.appendChild(wrapper);
            });
        }

        // --- 置換機能 ---
        function replaceAllText() {
            const srcText = document.getElementById('replace-src').value;
            const dstText = document.getElementById('replace-dst').value;
            if (!srcText) return alert("置き換え前の文字を入力してください。");

            pages[currentPageIndex] = editor.value;
            const escapedSrc = srcText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(escapedSrc, 'g');

            let totalCount = 0;
            pages = pages.map((pageText) => {
                const matches = pageText.match(regex);
                if (matches) totalCount += matches.length;
                return pageText.replace(regex, dstText);
            });

            editor.value = pages[currentPageIndex];
            updatePageData();
            alert(`すべてのページから「${srcText}」を「${dstText}」に一括置き換えしました（計 ${totalCount} 箇所）。`);
        }

        // --- 辞書機能 ---
        function handleTextSelection() {
            const text = editor.value.substring(editor.selectionStart, editor.selectionEnd).trim();
            if (text && editor.selectionStart !== editor.selectionEnd) selectedText = text;
        }

        function searchWordInline(type) {
            if (!selectedText) {
                previewArea.innerHTML = `<span style="color:#e74c3c;">⚠️ 本文の調べたい文字をドラッグ選択してから押してください。</span>`;
                return;
            }
            
            if (type === 'kotobank') {
                previewArea.innerHTML = `<span style="color:#3498db;">🔍 国語辞典で「${selectedText}」の意味を検索中...</span>`;
                fetch(`https://ja.wiktionary.org/api/rest_v1/page/summary/${encodeURIComponent(selectedText)}`)
                    .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                    .then(data => {
                        if (data.extract) previewArea.innerHTML = `<b>📘 「${selectedText}」の意味</b><br>${data.extract}`;
                        else showExternalLink('kotobank');
                    }).catch(() => showExternalLink('kotobank'));
            } else if (type === 'weblio') {
                previewArea.innerHTML = `<span style="color:#9b59b6;">🔍 類語辞典で「${selectedText}」の仲間を検索中...</span>`;
                fetch(`https://ja.wikipedia.org/api/rest_v1/page/related/${encodeURIComponent(selectedText)}`)
                    .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                    .then(data => {
                        if (data.pages && data.pages.length > 0) {
                            previewArea.innerHTML = `<b>📚 「${selectedText}」の類語</b><br>` + 
                            data.pages.slice(0, 5).map(p => `・<b>${p.title}</b>`).join('<br>');
                        } else showExternalLink('weblio');
                    }).catch(() => showExternalLink('weblio'));
            }
        }

        function showExternalLink(type) {
            let url = (type === 'kotobank') ? `https://kotobank.jp/word/${encodeURIComponent(selectedText)}` : `https://thesaurus.weblio.jp/content/${encodeURIComponent(selectedText)}`;
            previewArea.innerHTML = `⚠️ 自動抽出できませんでした<br><button onclick="window.open('${url}', '_blank')">🔗 外部サイトで調べる</button>`;
        }

        function resetDictInline() {
            selectedText = "";
            previewArea.innerHTML = "本文で文字を選択して、上のアイコンを押すとここに簡易表示されます。";
        }

        // --- メモ・保存・読込 ---
        function saveMemo() { localStorage.setItem('novel_memo', memoArea.value); }

        function exportToTxt() {
            pages[currentPageIndex] = editor.value;
            const joinedText = pages.map((text, idx) => `--- 【${idx + 1}ページ目】 ---\n${text}`).join('\n\n');
            const blob = new Blob([joinedText], { type: 'text/plain;charset=utf-8' });
            const fileName = document.getElementById('file-name-input').value.trim() || "novel_draft";
            
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${fileName}.txt`;
            a.click();
        }

        function importFromTxt(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parts = e.target.result.split(/--- 【\d+ページ目】 ---\n/);
                let newPages = parts.map(p => p.trim()).filter((p, i) => !(i === 0 && p === ""));
                if (newPages.length === 0) newPages = [e.target.result];

                pages = newPages;
                currentPageIndex = 0;
                localStorage.setItem('novel_saved_pages', JSON.stringify(pages));
                loadPage(0);
                alert(`テキストファイルから ${pages.length} ページ分を読み込みました。`);
                input.value = "";
            };
            reader.readAsText(file, 'utf-8');
        }
    </script>
</body>
</html>
