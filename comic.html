<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PROJECT #DOOR</title>

<style>

body{
    margin:0;
    background:#111;
    overflow:hidden;
    touch-action:pan-y;
}

/* ===== 上帯 ===== */

#header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:52px;

    background:#fff;
    color:#222;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;
    box-sizing:border-box;

    z-index:1000;

    font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

    transition:.25s;
}

#header.hide{
    transform:translateY(-100%);
}

#header a{
    color:#222;
    text-decoration:none;
}

/* ===== 読書エリア ===== */

#reader{

    position:fixed;

    top:52px;
    bottom:52px;
    left:0;
    right:0;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#page{

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    transition:
      opacity .18s ease,
      transform .18s ease;

    opacity:1;
}

/* ===== 下帯 ===== */

#footer{

    position:fixed;

    bottom:0;
    left:0;

    width:100%;
    height:52px;

    background:#000;
    color:#fff;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;
    box-sizing:border-box;

    z-index:1000;

    transition:.25s;
}

#footer.hide{
    transform:translateY(100%);
}

#controls button{

    width:36px;
    height:36px;

    margin-right:6px;

    border:none;

    background:#222;
    color:#fff;

    cursor:pointer;

    font-size:18px;
}

/* ===== タップエリア ===== */

.tap-left{

    position:fixed;

    left:0;

    top:52px;

    bottom:52px;

    width:35vw;
}

.tap-right{

    position:fixed;

    right:0;

    top:52px;

    bottom:52px;

    width:35vw;
}

.tap-center{

    position:fixed;

    left:35vw;

    width:30vw;

    top:52px;

    bottom:52px;
}

</style>
</head>

<body>

<!-- 上帯 -->

<div id="header">

<a href="index.html">
パン倉庫
</a>

<div>
Pan-souko @Tti_sbr
</div>

</div>

<!-- 漫画 -->

<div id="reader">

<img
id="page"
src="pages/002.png"
alt="page">

</div>

<!-- 下帯 -->

<div id="footer">

<div id="controls">

<button onclick="zoomIn()">＋</button>

<button onclick="zoomOut()">－</button>

</div>

<div>

<span id="current">1</span>
/
<span id="total">2</span>

</div>

</div>

<!-- タップ領域 -->

<div class="tap-left"></div>

<div class="tap-center"></div>

<div class="tap-right"></div>

<script>

/* ===== ページ一覧 ===== */

const pages = [

"pages/002.png",
"pages/003.png",
"pages/002.png",
"pages/002.png",
"pages/003.png",
"pages/002.png",
"pages/003.png"
];

/* ================= */

let current = 0;

let scale = 1;

let uiVisible = true;

document
.getElementById("total")
.textContent =
pages.length;

/* ===== ページ読込 ===== */

function loadPage(direction=1){

const img =
document.getElementById("page");

img.style.opacity="0";

img.style.transform=
`translateX(${direction*40}px) scale(${scale})`;

setTimeout(()=>{

img.src =
pages[current];

img.onload = ()=>{

img.style.transition =
"opacity .18s ease, transform .18s ease";

img.style.opacity="1";

img.style.transform=
`translateX(0px) scale(${scale})`;

};

},120);

document
.getElementById("current")
.textContent =
current+1;

}

/* ===== 次へ ===== */

function nextPage(){

if(
current <
pages.length-1
){

current++;

loadPage(1);

}

}

/* ===== 前へ ===== */

function prevPage(){

if(
current > 0
){

current--;

loadPage(-1);

}

}

/* ===== UI切替 ===== */

function toggleUI(){

uiVisible = !uiVisible;

document
.getElementById("header")
.classList
.toggle("hide");

document
.getElementById("footer")
.classList
.toggle("hide");

}

/* ===== ズーム ===== */

function zoomIn(){

scale += 0.1;

document
.getElementById("page")
.style.transform =
`scale(${scale})`;

}

function zoomOut(){

scale =
Math.max(
0.5,
scale-0.1
);

document
.getElementById("page")
.style.transform =
`scale(${scale})`;

}

/* ===== タップ ===== */

document
.querySelector(".tap-left")
.addEventListener(
"click",
prevPage
);

document
.querySelector(".tap-right")
.addEventListener(
"click",
nextPage
);

document
.querySelector(".tap-center")
.addEventListener(
"click",
toggleUI
);

/* ===== スワイプ ===== */

let startX = 0;

document
.addEventListener(
"touchstart",
e=>{

startX =
e.touches[0].clientX;

}
);

document
.addEventListener(
"touchend",
e=>{

let endX =
e.changedTouches[0].clientX;

let diff =
endX-startX;

if(diff > 60){

prevPage();

}

else if(diff < -60){

nextPage();

}

}
);

</script>

</body>
</html>
